<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTrack — 3D Faculty Locator | JIT Borawan</title>
    <meta name="description" content="Real-time 3D campus faculty locator for Jawaharlal Institute of Technology, Borawan. Find faculty locations instantly.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Three.js and loaders -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <style>
        :root {
            --bg: #dff4ff; --bg2: #ffffff; --bg3: #bfeeff;
            --border: #000000;
            --text: #0a0a0a; --text2: #303030; --text3: #626262;
            --accent: #ffe600; --accent-l: #167f78;
            --success: #22c55e; --warning: #f59e0b;
            --danger: #ef4444; --purple: #a855f7;
            --sidebar: 320px;
        }
        [data-theme="dark"] {
            --bg: #0d1117; --bg2: #161b22; --bg3: #1c2128;
            --border: rgba(255,255,255,0.12);
            --text: #e6edf3; --text2: #b0bac5; --text3: #8b949e;
            --accent: #ffe600; --accent-l: #4ecdc4;
        }
        [data-theme="light"] {
            --bg: #dff4ff; --bg2: #ffffff; --bg3: #bfeeff;
            --border: #000000; --text: #0a0a0a;
            --text2: #303030; --text3: #626262;
            --accent: #ffe600; --accent-l: #167f78;
        }
        *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
        body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }

        /* ═══════ LOADING ═══════ */
        #loading-overlay {
            position:fixed; inset:0; z-index:999;
            background:var(--bg);
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            transition:opacity 0.8s;
        }
        .load-icon { font-size:3rem; margin-bottom:16px; animation:spin 2s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .load-title { font-size:1.4rem; font-weight:800; color:var(--text); margin-bottom:6px; }
        .load-sub { font-size:0.8rem; color:var(--text3); margin-bottom:24px; }
        .load-bar-wrap { width:260px; height:8px; background:#fff; border:2px solid #000; overflow:hidden; }
        .load-bar { height:100%; background:#4ecdc4; width:0; transition:width 0.3s; }

        /* ═══════ SIDEBAR ═══════ */
        #sidebar {
            position:fixed; top:0; left:0; bottom:0; width:var(--sidebar);
            background:var(--bg); 
            border-right:3px solid #000;
            box-shadow:5px 0 0 #000;
            z-index:100; display:flex; flex-direction:column;
            transition:transform 0.3s;
        }
        .sb-header { padding:20px 16px 14px; border-bottom:3px solid #000; }
        .sb-logo { display:inline-block; padding:4px 8px; border:2px solid #000; background:#ffe600; color:#000; box-shadow:3px 3px 0 #000; font-size:1.1rem; font-weight:800; }
        .sb-sub { font-size:0.72rem; color:var(--text3); margin-top:2px; }
        #live-clock { font-size:0.82rem; color:var(--text2); margin-top:8px; font-variant-numeric:tabular-nums; }

        /* search */
        .search-area { padding:14px 16px; border-bottom:2px solid #000; }
        .search-wrap { position:relative; }
        #search-input {
            width:100%; background:var(--bg2); border:2px solid #000;
            border-radius:0; color:var(--text); padding:10px 40px 10px 40px;
            font-size:0.875rem; font-family:'Inter',sans-serif; outline:none;
            transition:border-color 0.2s;
        }
        #search-input:focus { border-color:#4ecdc4; box-shadow:3px 3px 0 #000; }
        #search-input::placeholder { color:var(--text3); }
        .search-icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--text3); }
        .search-clear { position:absolute; right:10px; top:50%; transform:translateY(-50%); padding:4px 6px; background:none; border:none; color:var(--text3); cursor:pointer; border-radius:4px; font-size:0.85rem; }
        .search-clear:hover { color:var(--text); }

        /* autocomplete dropdown */
        #autocomplete {
            position:absolute; top:calc(100% + 4px); left:0; right:0;
            background:var(--bg2); border:2px solid #000;
            border-radius:0; z-index:200; display:none;
            box-shadow:4px 4px 0 #000;
            max-height:240px; overflow-y:auto;
        }
        .ac-item {
            padding:10px 14px; cursor:pointer; display:flex; align-items:center; gap:10px;
            font-size:0.85rem; border-bottom:1px solid var(--border);
            transition:background 0.15s; color:var(--text);
        }
        .ac-item:last-child { border-bottom:none; }
        .ac-item:hover { background:#ffe600; color:#000; }
        .ac-status { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
        .ac-status.in_class { background:var(--success); }
        .ac-status.free { background:var(--warning); }
        .ac-status.not_scheduled { background:var(--text3); }
        .ac-status.overridden { background:var(--purple); }

        /* result / profile card */
        #result-panel {
            margin:0 16px 12px;
            background:linear-gradient(135deg, rgba(37,99,235,0.08), rgba(168,85,247,0.08));
            border:3px solid #000; border-radius:0; box-shadow:4px 4px 0 #000;
            padding:14px 16px; display:none;
        }
        .rc-header { font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--success); margin-bottom:8px; }
        .rc-header.notfound { color:var(--danger); }
        .rc-header.predicted { color:var(--warning); }
        .profile-row { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
        .profile-photo { width:44px; height:44px; border-radius:50%; object-fit:cover; border:2px solid #000; flex-shrink:0; }
        .profile-name { font-size:1rem; font-weight:700; }
        .profile-dept { font-size:0.75rem; color:var(--text2); }
        .profile-meta { display:flex; flex-direction:column; gap:4px; font-size:0.78rem; color:var(--text2); }
        .profile-meta span { display:flex; align-items:center; gap:6px; }
        .rc-location { display:flex; align-items:center; gap:6px; font-size:0.82rem; color:var(--accent-l); margin-top:8px; font-weight:600; }

        /* ML predictions */
        #ml-panel { padding:0 16px 14px; display:none; }
        .ml-title { font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--warning); margin-bottom:8px; display:flex; align-items:center; gap:6px; }
        .ml-item { display:flex; align-items:center; gap:10px; margin-bottom:6px; padding:8px 10px; background:var(--bg2); border-radius:0; border:2px solid #000; box-shadow:3px 3px 0 #000; cursor:pointer; transition:border-color 0.2s; }
        .ml-item:hover { background:#ffe600; }
        .ml-rank { width:20px; height:20px; border-radius:50%; background:rgba(245,158,11,0.15); color:var(--warning); font-size:0.65rem; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .ml-room { font-size:0.82rem; font-weight:600; flex:1; }
        .ml-bar-wrap { width:60px; height:4px; background:var(--bg3); border-radius:99px; overflow:hidden; }
        .ml-bar { height:100%; background:linear-gradient(90deg,var(--warning),#f97316); border-radius:99px; }
        .ml-pct { font-size:0.72rem; color:var(--warning); font-weight:700; width:38px; text-align:right; }

        /* faculty list */
        .list-header { padding:12px 16px 6px; display:flex; justify-content:space-between; align-items:center; }
        .list-title { font-size:0.7rem; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:var(--text2); }
        .list-refresh { background:none; border:none; color:var(--text3); cursor:pointer; font-size:0.78rem; transition:color 0.2s; }
        .list-refresh:hover { color:var(--text); }
        #faculty-list { flex:1; overflow-y:auto; padding:0 10px 16px; display:flex; flex-direction:column; gap:5px; }
        #faculty-list::-webkit-scrollbar { width:4px; }
        #faculty-list::-webkit-scrollbar-thumb { background:#4ecdc4; border:1px solid #000; }
        .fi {
            padding:10px 12px; border-radius:0; background:var(--bg2);
            border:2px solid #000; box-shadow:3px 3px 0 #000; cursor:pointer; transition:all 0.15s;
            display:flex; align-items:center; gap:10px;
        }
        .fi:hover { background:#ffe600; border-color:#000; transform:translate(-1px,-1px); box-shadow:4px 4px 0 #000; }
        .fi.active { background:#4ecdc4; border-color:#000; }
        .fi-status { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
        .fi-body { flex:1; min-width:0; }
        .fi-name { font-size:0.88rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .fi-dept { font-size:0.73rem; color:var(--text2); margin-top:1px; }
        .fi-loc { font-size:0.75rem; color:var(--accent-l); margin-top:3px; font-weight:700; }

        /* ═══════ CANVAS ═══════ */
        #canvas-container { position:fixed; top:0; left:var(--sidebar); right:0; bottom:0; }
        #canvas-container canvas { display:block; }

        /* ═══════ TOPBAR (floating) ═══════ */
        #topbar {
            position:fixed; top:12px; left:calc(var(--sidebar) + 12px); right:12px;
            background:var(--bg2);
            border:3px solid #000; border-radius:0; box-shadow:5px 5px 0 #000;
            padding:10px 16px; z-index:50;
            display:flex; align-items:center; gap:12px; flex-wrap:wrap;
        }
        .topbar-info { font-size:0.8rem; color:var(--text2); flex:1; }
        .topbar-info strong { color:var(--text); }
        .legend { display:flex; align-items:center; gap:14px; }
        .leg-item { display:flex; align-items:center; gap:5px; font-size:0.73rem; color:var(--text2); }
        .leg-dot { width:8px; height:8px; border-radius:50%; }
        .topbar-btns { display:flex; gap:8px; }
        .tb-btn {
            padding:6px 12px; border-radius:0; border:2px solid #000; box-shadow:3px 3px 0 #000;
            background:#ffe600; color:#000; cursor:pointer;
            font-size:0.78rem; font-weight:600; font-family:'Inter',sans-serif;
            transition:all 0.2s; display:flex; align-items:center; gap:5px;
        }
        .tb-btn:hover { background:#4ecdc4; color:#000; }

        /* ═══════ MOBILE ═══════ */
        #mobile-toggle {
            display:none; position:fixed; top:12px; left:12px; z-index:200;
            width:40px; height:40px; border-radius:0; background:#ffe600;
            border:2px solid #000; box-shadow:3px 3px 0 #000; color:#000; font-size:1rem; cursor:pointer;
            align-items:center; justify-content:center;
        }
        @media (max-width:768px) {
            :root { --sidebar:100%; }
            #sidebar { transform:translateX(-100%); }
            #sidebar.open { transform:none; }
            #canvas-container { left:0; }
            #topbar { left:54px; }
            #mobile-toggle { display:flex; }
            #topbar { top:60px; right:10px; padding:8px; gap:8px; }
            .legend { gap:8px; }
            .leg-item { font-size:0.65rem; }
            .topbar-info { min-width:100%; }
        }

        /* ═══════ NOTIFICATION TOAST ═══════ */
        #conn-toast {
            display:none; position:fixed; bottom:12px; right:12px;
            padding:10px 16px; border-radius:8px; font-size:0.8rem; font-weight:600; z-index:300;
        }
        #conn-toast.warn { background:#b91c1c; color:#fff; display:flex; align-items:center; gap:8px; }
    </style>
</head>
<body>

<!-- LOADING -->
<div id="loading-overlay">
    <div class="load-icon">🏛️</div>
    <div class="load-title">SmartTrack</div>
    <div class="load-sub">Loading 3D Campus Model…</div>
    <div class="load-bar-wrap"><div class="load-bar" id="load-bar"></div></div>
</div>

<!-- MOBILE TOGGLE -->
<button id="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">
    <i class="fas fa-bars"></i>
</button>

<!-- SIDEBAR -->
<div id="sidebar">
    <div class="sb-header">
        <div style="display:flex;align-items:center;justify-content:space-between">
            <div>
                <div class="sb-logo">⚡ SmartTrack</div>
                <div class="sb-sub">JIT Borawan — Faculty Locator</div>
            </div>
            <a href="/admin-panel/" title="Admin Panel" style="color:var(--text3);font-size:0.9rem;text-decoration:none">
                <i class="fas fa-cog"></i>
            </a>
        </div>
        <div id="live-clock">Loading…</div>
    </div>

    <div class="search-area">
        <div class="search-wrap">
            <i class="fas fa-search search-icon" style="font-size:0.8rem"></i>
            <input type="text" id="search-input" placeholder="Search faculty by name…" autocomplete="off">
            <button class="search-clear" id="search-clear" onclick="clearSearch()">✕</button>
        </div>
        <div id="autocomplete"></div>
    </div>

    <!-- Result Panel -->
    <div id="result-panel"></div>

    <!-- ML Predictions Panel -->
    <div id="ml-panel">
        <div class="ml-title"><i class="fas fa-brain"></i> ML Predicted Locations</div>
        <div id="ml-items"></div>
    </div>

    <!-- Faculty List -->
    <div class="list-header">
        <div class="list-title">All Faculty</div>
        <button class="list-refresh" onclick="loadFacultyData()" title="Refresh">
            <i class="fas fa-sync-alt"></i>
        </button>
    </div>
    <div id="faculty-list">
        <div style="text-align:center;padding:30px;color:var(--text3);font-size:0.8rem">
            <i class="fas fa-spinner fa-spin"></i> Loading faculty…
        </div>
    </div>
</div>

<!-- CANVAS -->
<div id="canvas-container"></div>

<!-- TOPBAR -->
<div id="topbar">
    <div class="topbar-info">🏛️ <strong id="tb-mode">Loading…</strong></div>
    <div class="legend">
        <div class="leg-item"><div class="leg-dot" style="background:#ef4444"></div> In Class</div>
        <div class="leg-item"><div class="leg-dot" style="background:#22c55e"></div> Free</div>
        <div class="leg-item"><div class="leg-dot" style="background:#f59e0b"></div> Predicted</div>
    </div>
    <div class="topbar-btns">
        <button class="tb-btn" onclick="resetCamera()" title="Reset camera">
            <i class="fas fa-home"></i>
        </button>
        <button class="tb-btn" id="theme-btn" onclick="toggleTheme()">
            <i class="fas fa-moon" id="theme-icon"></i>
        </button>
        <button class="tb-btn" onclick="refreshData()" title="Refresh data">
            <i class="fas fa-sync-alt" id="refresh-icon"></i>
        </button>
    </div>
</div>

<!-- Connection Warning -->
<div id="conn-toast">⚠️ Connection lost — Reconnecting…</div>

<script src="/static/js/main.js?v=3"></script>
</body>
</html>
